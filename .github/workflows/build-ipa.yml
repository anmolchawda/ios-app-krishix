name: Build KrishiX iOS IPA (SwiftUI + XcodeGen)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Generate Xcode Project & Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project KrishiX.xcodeproj -scheme KrishiX

      - name: Build iOS App with Xcodebuild (Unsigned for Sideloadly)
        run: |
          set -o pipefail
          xcodebuild -project KrishiX.xcodeproj \
            -scheme KrishiX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Print build errors if failed
        if: failure()
        run: |
          echo "=== RECENT XCODEBUILD OUTPUT ==="
          grep -E -C 3 -i "error:" xcodebuild.log || tail -n 150 xcodebuild.log

      - name: Push build log to branch on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          grep -E -C 4 -i "error:" xcodebuild.log > build-error-summary.txt || tail -n 250 xcodebuild.log > build-error-summary.txt
          tail -n 300 xcodebuild.log > xcodebuild-tail.log
          git add build-error-summary.txt xcodebuild-tail.log
          git commit -m "build error log from run ${{ github.run_id }}" || true
          git push -f origin build-logs || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: xcodebuild.log
          retention-days: 7

      - name: Package IPA
        run: |
          APP_PATH=$(find derived_data -name "KrishiX.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r KrishiX.ipa Payload

      - name: Upload KrishiX IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrishiX-iOS-IPA
          path: KrishiX.ipa
          retention-days: 14
